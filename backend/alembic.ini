[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Required from alembic 1.16 on; without it prepend_sys_path is split on
# spaces/commas/colons and a DeprecationWarning is emitted.
path_separator = os
sqlalchemy.url = sqlite:////app/data/aniflow.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
